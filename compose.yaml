services:
  newsroom:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - newsroom-data:/var/lib/newsroom
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
volumes:
  newsroom-data:
