# Fly.io single-instance deployment. Live since 2026-10-12 at https://agent-newsroom.fly.dev
# (app agent-newsroom, personal org, region sjc, volume newsroom_data, one machine).
#
# First-time steps on a machine with flyctl logged in:
#   fly apps create agent-newsroom            # or pick another name and update `app`
#   fly volumes create newsroom_data --region sjc --size 1
#   fly deploy
#   curl --fail https://agent-newsroom.fly.dev/api/health
# Then seed content once (see docs/DEPLOYMENT.md, "公网发布").
#
# Fly mounts the volume with uid/gid 1000 (verified in machine logs), so the
# non-root `node` user can write without any chown step.
# Keep exactly one machine: SQLite must never have two writers.

app = "agent-newsroom"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  DATA_DIR = "/var/lib/newsroom"
  PLATFORM_ONLY = "1"
  NODE_ENV = "production"

[[mounts]]
  source = "newsroom_data"
  destination = "/var/lib/newsroom"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[deploy]
  # Replace the single machine in place; a volume-backed app cannot run two copies.
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
